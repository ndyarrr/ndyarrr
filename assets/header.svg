<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" width="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap');
      
      .hero-title {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      
      .btn-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      
      .blinking-cursor {
        animation: cursorBlink 1s step-start infinite;
      }
    </style>
  </defs>

  <!-- Clean Minimalist Card Background -->
  <rect x="1" y="1" width="678" height="208" rx="12" fill="#181825" stroke="#313244" stroke-width="1.5" />

  <!-- Line 1: Greeting & Name Highlight -->
  <text x="44" y="68" class="hero-title" font-size="28" fill="#cdd6f4">
    Hi, my name is <tspan fill="#94e2d5">Fandy Ahmad</tspan>
  </text>

  <!-- Line 2: Role / Subtitle + Blinking Cursor -->
  <text x="44" y="112" class="hero-title" font-size="26" fill="#cdd6f4">
    I'm a Fullstack Developer.<tspan fill="#94e2d5" class="blinking-cursor"> |</tspan>
  </text>

  <!-- Outline Button "Know more" -->
  <rect x="44" y="145" width="124" height="34" rx="4" fill="none" stroke="#94e2d5" stroke-width="1.6" />
  <text x="106" y="167" class="btn-text" font-size="13" fill="#94e2d5" text-anchor="middle">Know more →</text>
</svg>
