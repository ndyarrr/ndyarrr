<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 215" width="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
      .term-text { font-family: 'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; }
      .cursor { animation: blink 1s step-start infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Window Container -->
  <rect x="1" y="1" width="798" height="213" rx="8" fill="#181825" stroke="#313244" stroke-width="1.5" />
  <rect x="1" y="1" width="798" height="213" rx="8" fill="url(#glow)" />

  <!-- Titlebar -->
  <line x1="1" y1="38" x2="799" y2="38" stroke="#313244" stroke-width="1.5" />
  
  <!-- Window Controls (Mac/Linux dots) -->
  <circle cx="22" cy="19" r="6" fill="#f38ba8" />
  <circle cx="42" cy="19" r="6" fill="#f9e2af" />
  <circle cx="62" cy="19" r="6" fill="#a6e3a1" />

  <!-- Titlebar Center Title -->
  <text x="400" y="24" class="term-text" font-size="12" fill="#a6adc8" text-anchor="middle" font-weight="500">fandy@archlinux: ~/dev/ndyarrr (zsh)</text>
  <text x="778" y="24" class="term-text" font-size="11" fill="#6c7086" text-anchor="end">utf-8 [unix]</text>

  <!-- Prompt Line (Pure Vector Chevrons & Git Icon) -->
  <path d="M24 63 L30 68 L24 73" fill="none" stroke="#a6e3a1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="38" y="72" class="term-text" font-size="13" fill="#89b4fa" font-weight="500">~/ndyarrr</text>
  <text x="122" y="72" class="term-text" font-size="13" fill="#6c7086">on</text>
  
  <!-- Git Branch Icon (Vector Path - works on all devices) -->
  <svg x="144" y="60" width="15" height="15" viewBox="0 0 16 16" fill="#cba6f7">
    <path fill-rule="evenodd" d="M11.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/>
  </svg>
  <text x="164" y="72" class="term-text" font-size="13" fill="#cba6f7" font-weight="500">main</text>
  
  <path d="M210 63 L216 68 L210 73" fill="none" stroke="#f5c2e7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="226" y="72" class="term-text" font-size="13" fill="#cdd6f4" font-weight="500">whoami</text>
  <rect x="282" y="58" width="7" height="16" fill="#cba6f7" class="cursor" />

  <!-- Identity Heading -->
  <text x="24" y="112" class="term-text" font-size="24" fill="#cdd6f4" font-weight="700" letter-spacing="1">FANDY AHMAD RIYANTO</text>
  <text x="24" y="136" class="term-text" font-size="13" fill="#a6adc8">Fullstack Developer  ·  Modern Web Architecture  ·  Tulungagung, ID</text>

  <!-- Tmux / Neovim Statusline Bar -->
  <rect x="14" y="168" width="772" height="28" rx="4" fill="#11111b" stroke="#313244" stroke-width="1" />
  
  <!-- Statusline NORMAL pill -->
  <rect x="14" y="168" width="82" height="28" rx="4" fill="#cba6f7" />
  <text x="55" y="186" class="term-text" font-size="11" font-weight="700" fill="#11111b" text-anchor="middle">NORMAL</text>
  
  <!-- Statusline Git Branch Vector Icon -->
  <svg x="108" y="175" width="14" height="14" viewBox="0 0 16 16" fill="#89b4fa">
    <path fill-rule="evenodd" d="M11.75 2.5a.75.75 0 100 1.5.75.75 0 000-1.5zm-2.25.75a2.25 2.25 0 113 2.122v5.256a2.251 2.251 0 11-1.5 0V5.372A2.25 2.25 0 011.5 3.25zM11 2.5h-1V4h1a1 1 0 011 1v5.628a2.251 2.251 0 101.5 0V5A2.5 2.5 0 0011 2.5zm1 10.25a.75.75 0 111.5 0 .75.75 0 01-1.5 0zM3.75 12a.75.75 0 100 1.5.75.75 0 000-1.5z"/>
  </svg>
  <text x="127" y="186" class="term-text" font-size="11" fill="#89b4fa" font-weight="500">main</text>
  
  <text x="172" y="186" class="term-text" font-size="11" fill="#45475a">│</text>
  <text x="188" y="186" class="term-text" font-size="11" fill="#a6e3a1">React</text>
  <text x="232" y="186" class="term-text" font-size="11" fill="#45475a">·</text>
  <text x="246" y="186" class="term-text" font-size="11" fill="#f5c2e7">Laravel</text>
  <text x="302" y="186" class="term-text" font-size="11" fill="#45475a">·</text>
  <text x="316" y="186" class="term-text" font-size="11" fill="#f9e2af">MySQL</text>
  
  <text x="772" y="186" class="term-text" font-size="11" fill="#a6adc8" text-anchor="end">status: open to work 🚀</text>
</svg>
